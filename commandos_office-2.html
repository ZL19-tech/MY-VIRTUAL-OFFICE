<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;}
:root{
  --bg:#0D1117;--walls:#1C2333;--green:#00FF88;--blue:#00BFFF;
  --gold:#FFD700;--text:#E6EDF3;--orange:#FF6B35;--desk:#243048;
  --monitor:#0A1628;--floor:#161B27;--purple:#9D4EDD;--teal:#20B2AA;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{display:flex;flex-direction:row;font-family:'Press Start 2P',monospace;font-size:14px;}

/* LEFT PANEL — Office (Responsive) */
#left-panel{flex:1;height:100vh;position:relative;overflow:hidden;width:calc(100vw - 550px);}
canvas{display:block;width:100%;height:100%;}

/* RIGHT PANEL — Tasks (Fixed width) */
#right-panel{
  flex:0 0 550px;height:100vh;background:#0A0F1A;
  border-left:2px solid #1C2333;
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}
#right-header{
  padding:14px 16px 10px;border-bottom:1px solid #1C2333;
  display:flex;align-items:center;justify-content:space-between;
  background:#0D1117;flex-shrink:0;
  gap:20px;
}
#right-header h2{font-size:9px;color:var(--green);letter-spacing:1px;}
#music-section{
  padding:10px 14px;border-top:1px solid #1C2333;flex-shrink:0;
  background:#080D16;display:flex;align-items:center;gap:10px;
}
#music-section .music-label{font-size:7px;color:var(--gold);font-family:'Press Start 2P';}
#music-input{
  background:#0D1520;border:1px solid #263348;color:var(--text);
  font-family:'Share Tech Mono',monospace;font-size:8px;padding:5px 8px;
  width:200px;outline:none;border-radius:1px;
}
#music-input:focus{border-color:var(--green);}
.music-btn{
  background:transparent;border:1px solid var(--green);color:var(--green);
  font-family:'Press Start 2P',monospace;font-size:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;
}
.music-btn:hover{background:rgba(0,255,136,0.1);}
.lang-btns{display:flex;gap:6px;}
.lang-btn{
  background:transparent;border:1px solid #263348;color:#8B949E;
  font-family:'Press Start 2P',monospace;font-size:7px;
  padding:5px 10px;cursor:pointer;transition:all .15s;
}
.lang-btn.active{background:var(--green);color:#0D1117;border-color:var(--green);}
.lang-btn:hover:not(.active){border-color:var(--green);color:var(--green);}

/* ADMIN CONTROLS */
#admin-section{
  padding:10px 14px;border-bottom:1px solid #1C2333;flex-shrink:0;
  background:#080D16;
}
#admin-section .admin-title{font-size:7px;color:var(--gold);margin-bottom:8px;}
#agent-buttons{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.agent-btn{
  font-family:'Press Start 2P',monospace;font-size:6px;padding:4px 8px;
  border:1px solid;cursor:pointer;transition:all .15s;background:transparent;
}
.agent-btn:hover{filter:brightness(1.4);}
#task-input{
  width:100%;background:#0D1520;border:1px solid #263348;
  color:var(--text);font-family:'Share Tech Mono',monospace;
  font-size:11px;padding:6px 8px;margin-bottom:6px;outline:none;
  border-radius:1px;
}
#task-input:focus{border-color:var(--green);}
#send-task-btn{
  width:100%;background:transparent;border:1px solid var(--green);
  color:var(--green);font-family:'Press Start 2P',monospace;font-size:7px;
  padding:7px;cursor:pointer;
}
#send-task-btn:hover{background:rgba(0,255,136,0.1);}

/* Task list */
#task-list-section{flex:1;overflow-y:auto;padding:10px 14px;}
#task-list-section::-webkit-scrollbar{width:4px;}
#task-list-section::-webkit-scrollbar-track{background:#080D16;}
#task-list-section::-webkit-scrollbar-thumb{background:#263348;}
.task-group-title{font-size:7px;color:var(--blue);margin:10px 0 6px;letter-spacing:1px;}
.task-item{
  background:#0D1520;border:1px solid #1C2333;border-left:3px solid;
  padding:7px 10px;margin-bottom:5px;font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--text);border-radius:1px;
  animation:fadeIn .3s ease;
}
.task-item.done{opacity:0.4;text-decoration:line-through;color:#556;}
.task-item .task-agent{font-size:8px;margin-bottom:3px;font-family:'Press Start 2P',monospace;}
.task-item .task-time{font-size:8px;color:#556;float:right;}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}

/* CHARTS SECTION */
#charts-section{
  padding:10px 14px;border-top:1px solid #1C2333;flex-shrink:0;
  height:160px;
}
#charts-section .chart-title{font-size:7px;color:var(--blue);margin-bottom:8px;}
#charts-canvas{width:100%;height:115px;display:block;}

/* Status bar */
#status-bar{
  padding:10px 14px;border-top:1px solid #1C2333;flex-shrink:0;
  background:#0D1117;display:flex;align-items:center;gap:30px;
  font-family:'Share Tech Mono',monospace;font-size:14px;color:#00FF88;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  display:inline-block;margin-right:5px;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Toast */
#toast-wrap{
  position:fixed;bottom:50px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  pointer-events:none;z-index:999;
}
.toast{
  background:rgba(0,255,136,0.08);border:1px solid var(--green);
  color:var(--green);font-family:'Share Tech Mono',monospace;font-size:10px;
  padding:5px 14px;white-space:nowrap;
  animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
}
.toast.warn{border-color:var(--orange);color:var(--orange);background:rgba(255,107,53,0.08);}
.toast.gold{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,0.08);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{to{opacity:0;}}

/* FaceID Modal */
#faceIdModal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);z-index:10000;
  display:none;align-items:center;justify-content:center;
}
#faceIdModal.active{display:flex;}
#faceIdBox{
  background:#0A0F1A;border:3px solid var(--green);border-radius:2px;
  padding:30px;text-align:center;width:400px;max-width:90vw;
  box-shadow:0 0 50px rgba(0,255,136,0.3);
}
#faceIdBox h2{
  color:var(--green);font-family:'Press Start 2P',monospace;font-size:16px;
  margin-bottom:20px;letter-spacing:2px;
}
#faceIdCamera{
  width:100%;height:300px;background:#000;border:2px solid var(--blue);
  margin:20px 0;position:relative;overflow:hidden;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
}
#faceIdCamera video{
  width:100%;height:100%;object-fit:cover;display:block;
}
#faceIdCamera canvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
}
#faceLoadingStatus{
  position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);
  color:var(--blue);font-family:'Press Start 2P', monospace;font-size:12px;
  text-align:center;z-index:10;text-shadow:0 0 10px rgba(0,191,255,0.5);
}
#faceIdCamera.scanning::before{
  content:'🔍 SCANNING...';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);color:var(--blue);font-size:20px;
  font-family:'Press Start 2P',monospace;z-index:5;
}
#faceIdCamera.scanning::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,transparent,rgba(0,191,255,0.3));
  animation:scanLine 1s infinite;z-index:4;
}
@keyframes scanLine{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(200px);}
}
#faceScanResult{
  margin:15px 0;min-height:40px;display:flex;align-items:center;
  justify-content:center;color:var(--green);font-family:'Share Tech Mono',monospace;
  font-size:12px;
}
#faceScanResult.success{color:var(--green);}
#faceScanResult.error{color:var(--orange);}
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
//  COMMANDOS OFFICE  –  Full Rebuilt
// ═══════════════════════════════════════════════════════════════════

// ── Music Control ───────────────────────────────────────────────────
const bgMusic = document.getElementById('bgMusic');
const musicInput = document.getElementById('music-input');
const playPauseBtn = document.getElementById('playPauseBtn');
let isMusicPlaying = true;  // Start as playing

function toggleMusic() {
  const url = musicInput.value.trim();

  if (url) {
    // Change to new URL if provided
    bgMusic.src = url;
  }

  if (isMusicPlaying) {
    // Pause
    bgMusic.pause();
    isMusicPlaying = false;
    playPauseBtn.textContent = '▶ PLAY';
    showToast('⏸ Paused', 'gold');
  } else {
    // Play
    bgMusic.volume = 0.3;
    bgMusic.play().catch(err => {
      console.error('Playback error:', err);
      showToast('⚠ Cannot play - check URL is direct MP3', 'warn');
    });
    isMusicPlaying = true;
    playPauseBtn.textContent = '⏸ PAUSE';
    showToast('🎵 Playing...', 'green');
  }
}

function stopMusic() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
  isMusicPlaying = false;
  playPauseBtn.textContent = '▶ PLAY';
  showToast('⏹ Stopped', 'gold');
}

// Allow Enter key to toggle play/pause
musicInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') toggleMusic();
});

// ── Voice Chat System (Game-style gibberish) ────────────────────────
// Creates audio context for voice-like chatter without real words
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playGameVoice(pitch = 400, duration = 0.3, type = 'sine') {
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    // Gibberish-like pitch variations
    osc.type = type;
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(pitch * 0.6, now + duration * 0.7);

    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {
    // Silently fail if audio context not available
  }
}

function playAgentChatter() {
  // Random gibberish voice pattern
  const patterns = [
    [400, 0.15, 350, 0.15, 420, 0.1],
    [380, 0.2, 420, 0.15, 360, 0.1],
    [410, 0.12, 390, 0.18, 440, 0.12],
    [370, 0.15, 400, 0.15, 380, 0.15],
  ];

  const pattern = patterns[Math.floor(Math.random() * patterns.length)];

  for (let i = 0; i < pattern.length; i += 2) {
    setTimeout(() => {
      playGameVoice(pattern[i], pattern[i + 1], Math.random() > 0.5 ? 'sine' : 'triangle');
    }, i * 50);
  }
}

// ── Background Image Asset Loader ──────────────────────────────────

let bgImage = null;
const bgImagePath = 'background.png';  // Relative path in project directory

// ── Language ────────────────────────────────────────────────────────
let LANG = 'ro';
const T = {

function t(key, ...args) {
  const fn = T[LANG][key];
  return typeof fn === 'function' ? fn(...args) : fn;
}
function setLang(lang) {
  LANG = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));

// ── Canvas setup ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const CANVAS_WIDTH = 1200;   // Fixed internal resolution
const CANVAS_HEIGHT = 950;   // Fixed internal resolution

// Responsive zoom system - "Fit to Screen"
let zoomLevel = 1.0;  // 1.0 = 100% zoom
let offsetX = 0;      // Horizontal centering offset
let offsetY = 0;      // Vertical centering offset

function calculateZoom() {
  const panel = document.getElementById('left-panel');
  const maxWidth = panel.clientWidth;
  const maxHeight = panel.clientHeight;

  // Calculate zoom needed to fit 1200x950 into available space
  const zoomX = maxWidth / CANVAS_WIDTH;
  const zoomY = maxHeight / CANVAS_HEIGHT;

  // Use smaller zoom (most restrictive) to ensure everything fits
  zoomLevel = Math.min(zoomX, zoomY);

  // Calculate centering offsets
  const scaledWidth = CANVAS_WIDTH * zoomLevel;
  const scaledHeight = CANVAS_HEIGHT * zoomLevel;
  offsetX = (maxWidth - scaledWidth) / 2;
  offsetY = (maxHeight - scaledHeight) / 2;
}

function resizeCanvas() {
  const panel = document.getElementById('left-panel');
  canvas.width  = panel.clientWidth;
  canvas.height = panel.clientHeight;
  calculateZoom();
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Scaling functions - now work with fixed internal resolution
function S(v)  { return v; }  // No longer needs to scale - zoom handles it
function sx(x) { return x; }
function sy(y) { return y; }

// ── Color palette ───────────────────────────────────────────────────
const C = {
  bg:'#0D1117', walls:'#1C2333', floor:'#161B27', desk:'#243048',
  deskTop:'#2D3A52', green:'#00FF88', blue:'#00BFFF', gold:'#FFD700',
  text:'#E6EDF3', orange:'#FF6B35', monitor:'#0A1628', dim:'#8B949E',
  purple:'#9D4EDD', teal:'#20B2AA', pink:'#FF69B4', red:'#FF3355',
};

// ── Agent definitions ───────────────────────────────────────────────
const AGENTS = [
  { id:'alexa',     name:'Alexa',     job:'Marketing',      color:C.blue,   accent:'#FFFFFF', icon:'⊕', hp:100, maxHp:100, tasks:0, state:'idle', x:0, y:0, deadTimer:0, deadAnim:0, clothing:'tshirt' },
  { id:'scout',     name:'Scout',     job:'Sales',          color:C.green,  accent:'#FFFFFF', icon:'◉', hp:100, maxHp:100, tasks:0, state:'idle', x:0, y:0, deadTimer:0, deadAnim:0, clothing:'tshirt' },
  { id:'memo',      name:'Memo',      job:'Management',     color:C.purple, accent:'#FFFFFF', icon:'♪', hp:100, maxHp:100, tasks:0, state:'idle', x:0, y:0, deadTimer:0, deadAnim:0, clothing:'tshirt' },
  { id:'doc',       name:'Doc',       job:'Content Creator', color:C.teal,   accent:'#FFFFFF', icon:'⊞', hp:100, maxHp:100, tasks:0, state:'idle', x:0, y:0, deadTimer:0, deadAnim:0, clothing:'tshirt' },
  { id:'cal',       name:'Cal',       job:'Ads Manager',     color:C.orange, accent:'#FFFFFF', icon:'◫', hp:100, maxHp:100, tasks:0, state:'idle', x:0, y:0, deadTimer:0, deadAnim:0, clothing:'tshirt' },
  { id:'commander', name:'CommandOS', job:'CEO',             color:C.gold,   accent:'#B8860B', icon:'♛', hp:100, maxHp:100, tasks:0, state:'hidden', x:20, y:100, deadTimer:0, deadAnim:0, clothing:'classic' },
];

// Grid layout for 6 agents with EQUAL SPACING
// Canvas: 1200x950, Walls: 30px left/right, 180px top, 70px bottom
// Usable space: X[30-1170], Y[180-880]
// Agents near windows (top), CommandOS far from bottom wall

const GRID = [
  // ROW 1: 3 agents equally spaced (horizontal) - NEAR WINDOWS (top area)
  { x: 90,   y: 210  },   // alexa     (row1 col1 - left near windows)
  { x: 500,  y: 210  },   // scout     (row1 col2 - center near windows)
  { x: 910,  y: 210  },   // memo      (row1 col3 - right near windows)

  // ROW 2: 2 agents equally spaced, centered on canvas - MIDDLE AREA
  { x: 250,  y: 450  },   // doc       (row2 col1 - left-center)

function sendTask() {
  const input = document.getElementById('task-input');
  const text  = input.value.trim();

  if (!text) {
    showToast('⚠ Write a task first', 'warn');
    return;
  }

  if (!selectedAgentId) {
    showToast('⚠ Select an agent first', 'warn');
    return;
  }

  // Only assign if it's Commander creating the task
  assignTask(selectedAgentId, text, true);
  input.value = '';
}
document.getElementById('task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendTask();
});

function assignTask(agentId, taskText, fromAdmin) {
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return;

  // HP damage: 12–22 per task
  const dmg = 12 + Math.floor(Math.random() * 10);
  agent.hp = Math.max(0, agent.hp - dmg);
  agent.tasks++;
  totalTaskCount++;

  // Task log
  const task = {
    id: Date.now() + Math.random(),
    agentId,
    agentName: agent.name,
    agentColor: agent.color,
    text: taskText,
    done: false,
    time: new Date().toLocaleTimeString('ro-RO', {hour:'2-digit',minute:'2-digit'}),
  };
  taskLog.unshift(task);
  renderTaskList();

  // Animation triggers
  addBubble(agentId, taskText.slice(0, 22) + (taskText.length > 22 ? '…' : ''), agent.color, 90);
  addStatus(agentId, 'TASK ▓▓▓░░', 70);
  // Regular agents stay sitting, only set sit_work state
  if (agent.state !== 'dead' && agent.id !== 'admin') agent.state = 'sit_work';

  showToast(t('taskAssigned', agent.name, taskText), 'green');

  // Low HP warning
  if (agent.hp <= 30 && agent.hp > 0) {
    showToast(t('lowHp', agent.name), 'warn');
  }

  // Death
  if (agent.hp <= 0 && agent.state !== 'dead') {
    killAgent(agent);
  }

  updateStatusBar();

  // Auto-complete after delay
  if (agent.state !== 'dead') {
    setTimeout(() => {
      task.done = true;
      renderTaskList();
      showToast(t('taskDone', agent.name), 'green');
      // Slowly recover HP
      agent.hp = Math.min(agent.maxHp, agent.hp + 5);
      // Regular agents stay sitting, don't change state
      // Only Admin can move around
    }, 8000 + Math.random() * 6000);
  }
}

function killAgent(agent) {
  agent.hp = 0;
  agent.state = 'dead';
  agent.deadTimer = 300;  // ticks before respawn
  showToast(t('agentDead', agent.name), 'warn');
  addBubble(agent.id, '💀 x_x', C.red, 120);

  // Respawn after 8 seconds
  setTimeout(() => {
    if (agent.state === 'dead') {
      agent.hp = 60;
      agent.state = 'idle';
      agent.deadTimer = 0;
      agent.deadAnim = 0;
      showToast(`🔄 ${agent.name}: respawn!`, 'gold');
    }
  }, 8000);
}

function renderTaskList() {
  const activeDiv = document.getElementById('active-tasks');
  const doneDiv   = document.getElementById('done-tasks');
  activeDiv.innerHTML = '';
  doneDiv.innerHTML   = '';

  taskLog.slice(0, 30).forEach(task => {
    const div = document.createElement('div');
    div.className = 'task-item' + (task.done ? ' done' : '');
    div.style.borderLeftColor = task.agentColor;
    div.innerHTML = `
      <span class="task-agent" style="color:${task.agentColor}">${task.agentName}</span>
      <span class="task-time">${task.time}</span>
      <div>${task.text}</div>
    `;
    (task.done ? doneDiv : activeDiv).appendChild(div);
  });
  updateStatusBar();
}

function updateStatusBar() {
  const active = taskLog.filter(t => !t.done).length;
  document.getElementById('sb-tasks').textContent = t('sbTasks', active);
  const alive = AGENTS.filter(a => a.state !== 'dead').length;
  document.getElementById('sb-agents').textContent = t('sbAgents', alive);
}

function fillR(x, y, w, h, color, alpha) {

  ctx.fillRect(sx(x), sy(y), S(w), S(h) * (700/700));

}
function fillRpx(x, y, w, h, color, alpha) {
  // raw pixel coords
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;

}
function txt(t2, x, y, size, color, align, mono) {

// ── HP Bar ───────────────────────────────────────────────────────────
function drawHPBar(agent, gx, gy) {
  // Position: top of desk cell
  const bx = sx(gx + 10), by = sy(gy + 8);
  const bw = S(280), bh = S(10);
  const pct = agent.hp / agent.maxHp;

  // Background
  ctx.fillStyle = '#0A1020';
  ctx.fillRect(bx, by, bw, bh);

  // Bar color: green → yellow → red
  let barColor;
  if (pct > 0.6) barColor = C.green;
  else if (pct > 0.3) barColor = C.gold;
  else barColor = C.red;

  // Animated flash when low
  const flash = pct <= 0.3 ? (Math.sin(tick * 0.3) > 0 ? 1 : 0.4) : 1;
  ctx.globalAlpha = flash;
  ctx.fillStyle = barColor;
  ctx.fillRect(bx, by, bw * pct, bh);
  ctx.globalAlpha = 1;

  // Border
  ctx.strokeStyle = '#263348';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  // HP text
  ctx.font = `${S(6.5)}px "Share Tech Mono", monospace`;
  ctx.fillStyle = pct > 0.3 ? C.text : C.red;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`HP ${Math.ceil(agent.hp)}/${agent.maxHp}`, bx + bw/2, by + bh/2);

  // Skull icon when dead
  if (agent.state === 'dead') {
    ctx.font = `${S(14)}px serif`;
    ctx.fillText('💀', bx + bw/2, by - S(8));
  }
}

// ── Premium Wood Texture Helper ──────────────────────────────────────
function drawWoodTexture(x, y, w, h, baseColor) {
  // Base color
  ctx.fillStyle = baseColor;
  ctx.fillRect(x, y, w, h);

  // Horizontal wood grain lines
  ctx.strokeStyle = '#1A0F00';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < h; i += 3) {
    if (Math.random() > 0.3) {
      ctx.globalAlpha = 0.1 + Math.random() * 0.15;
      ctx.beginPath();
      ctx.moveTo(x, y + i);
      ctx.lineTo(x + w, y + i + Math.sin(i * 0.02) * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // Wood highlight streaks
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.05;
  for (let i = 0; i < Math.floor(h / 8); i++) {
    const randY = y + Math.random() * h;
    ctx.fillRect(x, randY, w * (0.4 + Math.random() * 0.3), 1);
  }
  ctx.globalAlpha = 1;
}

// ── Realistic Monitor Drawing ────────────────────────────────────────
function drawRealisticMonitor(x, y, w, h, color) {
  // Monitor base/stand
  ctx.fillStyle = '#2A2A2A';
  ctx.fillRect(x + w/2 - 6, y + h - 4, 12, 8);

  // Monitor frame - dark bezel
  ctx.fillStyle = '#0F0F14';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 2);

  // Screen area - blue tinted
  ctx.fillStyle = '#1A3A5E';
  ctx.fillRect(x + 1, y + 1, w - 2, h - 5);

  // Screen glow with agent color
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.1 + 0.04 * Math.sin(tick * 0.05);
  ctx.fillRect(x + 1, y + 1, w - 2, h - 5);
  ctx.globalAlpha = 1;

  // Top bezel highlight
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.2;
  ctx.fillRect(x + 1, y + 1, w - 2, 1);
  ctx.globalAlpha = 1;
}

// ── Pixel-Art Office Desk - Premium Wood Style ───────────────────────
function drawDesk(gx, gy, agent) {
  const W = 300, H = 140;

  // Shadow under desk
  drawDeskShadow(gx - 8, gy + 20 + H, W + 16, 8);

  // Main desk surface with wood texture
  const deskColor = '#5A4B38';
  drawWoodTexture(gx - 5, gy + 20, W + 10, H, deskColor);

  // Top edge highlight
  ctx.fillStyle = '#7B6A57';
  ctx.globalAlpha = 0.4;
  ctx.fillRect(gx - 5, gy + 20, W + 10, 2);
  ctx.globalAlpha = 1;

  // LEFT SIDE DRAWERS (3 drawers)
  const drawerLeft = gx - 6;
  const drawerW = 18;
  const drawerH = 15;
  const drawerSpacing = 18;
  const drawerY = gy + 30;

  for (let i = 0; i < 3; i++) {
    const dy = drawerY + i * drawerSpacing;

    // Drawer background
    ctx.fillStyle = '#4A3B2A';
    ctx.fillRect(drawerLeft, dy, drawerW, drawerH);

    // Drawer texture
    drawWoodTexture(drawerLeft + 1, dy + 1, drawerW - 2, drawerH - 2, '#5A4B38');

    // Drawer shadow
    ctx.fillStyle = '#0F0F14';
    ctx.globalAlpha = 0.3;
    ctx.fillRect(drawerLeft, dy + drawerH - 1, drawerW, 1);
    ctx.globalAlpha = 1;

    // Brass handle
    drawBrassHandle(drawerLeft + drawerW - 3, dy + drawerH/2, 3);
  }

  // RIGHT SIDE DRAWERS (3 drawers) - mirrored
  const drawerRight = gx + W - 12;

  for (let i = 0; i < 3; i++) {
    const dy = drawerY + i * drawerSpacing;

    ctx.fillStyle = '#4A3B2A';
    ctx.fillRect(drawerRight, dy, drawerW, drawerH);

    drawWoodTexture(drawerRight + 1, dy + 1, drawerW - 2, drawerH - 2, '#5A4B38');

    ctx.fillStyle = '#0F0F14';
    ctx.globalAlpha = 0.3;
    ctx.fillRect(drawerRight, dy + drawerH - 1, drawerW, 1);
    ctx.globalAlpha = 1;

    drawBrassHandle(drawerRight + 3, dy + drawerH/2, 3);
  }

  // Support legs (bottom)
  ctx.fillStyle = '#3A3A2A';
  ctx.fillRect(gx + 5, gy + 20 + H - 3, 8, 3);
  ctx.fillRect(gx + W - 13, gy + 20 + H - 3, 8, 3);

  // Desktop accessories
  const centerX = gx + W/2;

  // Realistic monitor
  drawRealisticMonitor(centerX - 50, gy + 8, 100, 45, agent.color);

  // Keyboard area
  ctx.fillStyle = '#1A1A1A';
  ctx.fillRect(centerX - 40, gy + 65, 80, 12);
  for (let kx = centerX - 35; kx < centerX + 40; kx += 8) {
    for (let ky = gy + 68; ky < gy + 75; ky += 3) {
      ctx.fillStyle = '#2A2A2A';
      ctx.fillRect(kx, ky, 6, 2);
    }
  }

  // Mouse
  ctx.fillStyle = '#1A1A1A';
  ctx.fillRect(centerX + 50, gy + 70, 8, 6);

  // Agent function label
  ctx.font = `${S(6.5)}px "Share Tech Mono", monospace`;
  ctx.fillStyle = agent.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(agent.job, sx(centerX), sy(gy + H + 20));
}

// ── Draw large realistic corner plants ─────────────────────────────
function drawLargeCornerPlant(x, y) {
  // Large terracotta pot
  const potWidth = 60;
  const potHeight = 50;

  // Pot body (trapezoid shape - wider at top)
  ctx.fillStyle = '#A0522D';  // Sienna brown
  ctx.beginPath();
  ctx.moveTo(x - potWidth/2, y + potHeight);  // Bottom-left
  ctx.lineTo(x - potWidth/2 - 8, y);           // Top-left (wider)
  ctx.lineTo(x + potWidth/2 + 8, y);           // Top-right (wider)
  ctx.lineTo(x + potWidth/2, y + potHeight);  // Bottom-right
  ctx.fill();

  // Pot shading (darker right side for depth)
  ctx.fillStyle = '#8B4513';
  ctx.beginPath();
  ctx.moveTo(x + potWidth/2, y + potHeight);
  ctx.lineTo(x + potWidth/2 + 8, y);
  ctx.lineTo(x + potWidth/2 + 4, y + 20);
  ctx.lineTo(x + potWidth/2 - 4, y + potHeight - 10);
  ctx.fill();

  // Pot rim (lip at top)
  ctx.fillStyle = '#CD853F';  // Peru
  ctx.fillRect(x - potWidth/2 - 10, y - 5, potWidth + 20, 8);

  // Pot rim detail
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(x, y - 1, potWidth/2 + 8, 4, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Soil inside pot
  ctx.fillStyle = '#654321';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, potWidth/2, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Large plant foliage - realistic fern/bushy plant
  const foliageX = x;
  const foliageY = y - 60;

  // Multiple layered leaves for full effect
  ctx.fillStyle = '#228B22';  // Forest green
  ctx.globalAlpha = 0.9;

  // Back layer (behind)
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const leafX = foliageX + Math.cos(angle) * 25;
    const leafY = foliageY + Math.sin(angle) * 35;
    drawLeaf(leafX, leafY, angle + Math.PI/2, 18, 35);
  }

  // Middle layer
  ctx.fillStyle = '#2E8B57';  // Sea green
  ctx.globalAlpha = 0.85;
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2 + 0.3;
    const leafX = foliageX + Math.cos(angle) * 35;
    const leafY = foliageY + Math.sin(angle) * 40;
    drawLeaf(leafX, leafY, angle + Math.PI/2, 16, 32);
  }

  // Front layer (top - brightest green)
  ctx.fillStyle = '#3CB371';  // Medium sea green
  ctx.globalAlpha = 0.95;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const leafX = foliageX + Math.cos(angle) * 28;
    const leafY = foliageY + Math.sin(angle) * 32;
    drawLeaf(leafX, leafY, angle + Math.PI/2, 14, 28);
  }

  // Center highlights (lighter green tips)
  ctx.fillStyle = '#90EE90';  // Light green
  ctx.globalAlpha = 0.6;
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const leafX = foliageX + Math.cos(angle) * 20;
    const leafY = foliageY + Math.sin(angle) * 25;
    drawLeaf(leafX, leafY, angle + Math.PI/2, 10, 20);
  }

  ctx.globalAlpha = 1;

  // Stem visible between leaves
  ctx.strokeStyle = '#654321';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y + 5);
  ctx.lineTo(x, foliageY + 20);
  ctx.stroke();
}

// ── Draw individual leaf ───────────────────────────────────────────
function drawLeaf(x, y, angle, width, height) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // Leaf shape (pointed oval)
  ctx.beginPath();
  ctx.ellipse(0, 0, width, height, 0, 0, Math.PI * 2);
  ctx.fill();

  // Leaf vein detail
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, -height);
  ctx.lineTo(0, height);
  ctx.stroke();

  ctx.restore();
}

// ── Professional Office Desks - Modern Minimalist Style ─────────────
function drawProfessionalDesk(gx, gy, agent, isCommander = false) {
  let W, H;

  if (isCommander) {
    // COMMANDER DESK - Larger and more prominent
    W = 280;
    H = 100;
  } else {
    // STANDARD AGENT DESK - Clean and compact
    W = 200;
    H = 70;
  }

  const deskTopY = gy + 20;

  // MODERN DESK TOP - Clean surface with subtle shadow
  ctx.fillStyle = '#8B7355';  // Medium wood tone
  ctx.fillRect(gx, deskTopY, W, H);

  // Top edge highlight (reflects light)
  ctx.fillStyle = '#A0876B';
  ctx.fillRect(gx, deskTopY, W, 2);

  // Subtle shadow at bottom
  ctx.fillStyle = '#6B5345';
  ctx.fillRect(gx, deskTopY + H - 2, W, 2);

  // Sleek metal frame legs (modern minimalist)
  const legX1 = gx + 15;
  const legX2 = gx + W - 20;
  const legY = deskTopY + H;
  const legW = 6;
  const legH = 20;

  ctx.fillStyle = '#454545';  // Dark metal gray
  ctx.fillRect(legX1, legY, legW, legH);
  ctx.fillRect(legX2, legY, legW, legH);

  // Subtle desk accent line
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.moveTo(gx + 5, deskTopY + 3);
  ctx.lineTo(gx + W - 5, deskTopY + 3);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Minimal desk decoration - agent color accent
  if (!isCommander) {
    ctx.fillStyle = agent.color;
    ctx.globalAlpha = 0.25;
    ctx.fillRect(gx + W - 25, deskTopY + 10, 20, 3);  // Small colored bar
    ctx.globalAlpha = 1;
  } else {
    // COMMANDER DESK - two colored bars for prestige
    ctx.fillStyle = agent.color;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(gx + W - 40, deskTopY + 15, 35, 3);
    ctx.globalAlpha = 1;
  }
}

function drawDeskColorPalette(x, y, w, h, mainColor) {
  // Palette base
  fillR(x, y, w, h, '#8B6F47');

  // Color swatches
  const colors = [C.red, C.orange, C.gold, C.green, C.blue, C.purple];
  const cols = 2, rows = 3;
  const sw = (w - 4) / cols, sh = (h - 4) / rows;

  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {

function drawDeskWaveform(x, y, w, h, color) {
  // Waveform display
  ctx.strokeStyle = color;
  ctx.lineWidth = S(2);
  ctx.beginPath();
  for (let i = 0; i < w; i += 4) {
    const wave = Math.sin((i + tick * 2) * 0.15) * (h / 2 - 4) + h / 2;
    const px = x + i, py = y + wave;
    i === 0 ? ctx.moveTo(sx(px), sy(py)) : ctx.lineTo(sx(px), sy(py));
  }
  ctx.stroke();
}

// ── Pixel Agent sprite ───────────────────────────────────────────────
function drawAgent(agent) {
  const a = agent;
  if (a.state === 'hidden') {
    return;  // Don't draw hidden agents (CommandOS not arrived yet, or lunch time)
  }
  if (a.state === 'dead') {
    drawDeadAgent(a);
    return;
  }

  // Sitting: agent offset
  const sitting = a.state === 'sit_work';
  const isAdmin = a.id === 'admin';
  const scale = isAdmin ? 1.4 : 1;  // Admin is 40% bigger
  const ax = sx(a.x), ay = sy(a.y) + (sitting ? S(35) : 0);
  const pw = S(62 * scale), ph = S(95 * scale);
  const bob = sitting ? 0 : Math.floor(Math.sin(tick * 0.1) * S(3));
  const walkLeg = a.state === 'walk' ? Math.sin(tick * 0.28) : 0;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(ax-S(8), ay+ph-S(5), pw+S(14), S(10));

  // Legs
  const legL = sitting ? S(28) : S(8) + walkLeg * S(12);
  const legR = sitting ? S(28) : S(8) - walkLeg * S(12);
  ctx.fillStyle = '#1A1A2E';  // Dark pants
  ctx.fillRect(ax+S(12), ay+S(52)+bob, S(16), legL);
  ctx.fillRect(ax+S(34), ay+S(52)+bob, S(16), legR);

  // Shoes
  ctx.fillStyle = '#0F0F1A';
  ctx.fillRect(ax+S(10), ay+S(52)+bob+legL, S(20), S(8));
  ctx.fillRect(ax+S(32), ay+S(52)+bob+legR, S(20), S(8));

  // Body/T-shirt (white for most, with styling)
  if (a.clothing === 'classic') {
    // Classic suit with tie
    ctx.fillStyle = '#2A2A3A';  // Dark jacket
    ctx.fillRect(ax+S(6), ay+S(22)+bob, pw-S(12), S(36));
    // Tie
    ctx.fillStyle = a.color;
    ctx.fillRect(ax+S(28), ay+S(22)+bob, S(6), S(20));
  } else {
    // Simple white t-shirt
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(ax+S(6), ay+S(22)+bob, pw-S(12), S(36));
  }

  // Collar detail / shirt accent
  if (a.clothing === 'classic') {
    ctx.fillStyle = '#EEEEEE';
    ctx.fillRect(ax+S(20), ay+S(22)+bob, S(22), S(6));
  } else {
    ctx.fillStyle = a.color;  // Color accent on t-shirt
    ctx.fillRect(ax+S(20), ay+S(22)+bob, S(22), S(5));
  }

  // Arms - minimal movement, just up/down bobbing
  const armBob = Math.floor(Math.sin(tick * 0.05) * S(2));
  if (a.clothing === 'classic') {
    ctx.fillStyle = '#2A2A3A';  // Jacket sleeves
  } else {
    ctx.fillStyle = '#FFFFFF';  // T-shirt sleeves
  }

  if (a.state === 'point') {
    ctx.fillRect(ax-S(16), ay+S(28)+bob, S(22), S(12));
    ctx.fillRect(ax+pw-S(6), ay+S(28)+bob, S(16), S(12));
  } else {
    // Just subtle vertical bobbing, no swinging
    ctx.fillRect(ax-S(7), ay+S(25)+bob+armBob, S(14), S(32));
    ctx.fillRect(ax+pw-S(7), ay+S(25)+bob+armBob, S(14), S(32));
  }

  // Head
  ctx.fillStyle = '#D4A574';
  ctx.fillRect(ax+S(12), ay+S(0)+bob, S(38), S(28));

  // Hair
  ctx.fillStyle = a.color;
  ctx.fillRect(ax+S(12), ay+bob, S(38), S(8));

  // Blink
  const blink = (tick % 100) < 94;
  ctx.fillStyle = '#000020';
  if (blink) {
    ctx.fillRect(ax+S(19), ay+S(10)+bob, S(6), S(7));
    ctx.fillRect(ax+S(37), ay+S(10)+bob, S(6), S(7));
  } else {
    ctx.fillRect(ax+S(19), ay+S(14)+bob, S(6), S(2));
    ctx.fillRect(ax+S(37), ay+S(14)+bob, S(6), S(2));
  }

  // Pupils - simple white dots
  if (blink) {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(ax+S(21), ay+S(11)+bob, S(2), S(2));
    ctx.fillRect(ax+S(39), ay+S(11)+bob, S(2), S(2));
  }
  // Mouth
  ctx.fillStyle = '#A0704A';
  ctx.fillRect(ax+S(22), ay+S(22)+bob, S(16), S(4));

  // Job title BOX - BACKGROUND
  const jobBoxW = S(180);
  const jobBoxH = S(32);
  const jobBoxX = ax + pw/2 - jobBoxW/2;
  const jobBoxY = ay - S(82);
  ctx.fillStyle = a.color;
  ctx.globalAlpha = 0.15;
  ctx.fillRect(jobBoxX, jobBoxY, jobBoxW, jobBoxH);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = a.color;
  ctx.lineWidth = S(3);
  ctx.strokeRect(jobBoxX, jobBoxY, jobBoxW, jobBoxH);

  // Job title - INSIDE BOX - MUCH BIGGER
  ctx.font = `${S(12)}px "Press Start 2P", monospace`;
  ctx.fillStyle = a.color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(a.job, ax+pw/2, jobBoxY + jobBoxH/2);

  // Role icon - BIGGER - WHITE
  ctx.font = `${S(26)}px serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(a.icon, ax+pw/2, ay-S(16)+bob);

  // Name - BIGGER - WHITE
  ctx.font = `${S(14)}px "Press Start 2P", monospace`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(a.name, ax+pw/2, ay-S(40));

  // Waving arm
  if (waveAnim[a.id] > 0) {
    const wt = waveAnim[a.id];
    ctx.save();
    ctx.translate(ax-S(6), ay+S(30)+bob);
    ctx.rotate(Math.sin(wt * 0.3) * 0.6);
    if (a.clothing === 'classic') ctx.fillStyle = '#2A2A3A';
    else ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(-S(12), -S(5), S(14), S(32));
    ctx.restore();
  }
}

function drawDeadAgent(agent) {
  const g = GRID[agent.gridIdx];
  const ax = sx(g.x + 60);
  const ay = sy(g.y + 210);
  agent.deadAnim = Math.min(1, agent.deadAnim + 0.05);
  const angle = (Math.PI / 2) * agent.deadAnim;

  ctx.save();
  ctx.translate(ax + S(26), ay);
  ctx.rotate(angle);
  ctx.translate(-S(26), 0);

  // Body horizontal
  const pw = S(52);
  ctx.fillStyle = agent.accent;
  ctx.fillRect(0, 0, pw, S(14)); // legs
  ctx.fillStyle = agent.color;
  ctx.fillRect(S(6), -S(30), pw-S(12), S(30)); // body
  // Head
  ctx.fillStyle = '#D4A574';
  ctx.fillRect(S(10), -S(54), S(32), S(24));
  // X eyes
  ctx.fillStyle = C.red;
  ctx.font = `${S(18)}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('×_×', S(26), -S(42));
  ctx.restore();

  // Skull floating
  const float = Math.sin(tick * 0.08) * S(4);
  ctx.font = `${S(20)}px serif`;
  ctx.textAlign = 'center';
  ctx.fillText('💀', ax + S(26), ay - S(30) + float);

  // Respawn timer text
  const remaining = Math.ceil(agent.deadTimer / 60);
  ctx.font = `${S(7)}px "Share Tech Mono", monospace`;
  ctx.fillStyle = C.red;
  ctx.fillText(`DEAD`, ax + S(26), ay + S(30));
}

// Helper to check if a rectangle overlaps with any blocked areas
function checkCollision(x, y, w, h, blockedAreas) {
  return blockedAreas.some(area => {
    return !(x + w < area.x || x > area.x + area.w ||
             y + h < area.y || y > area.y + area.h);
  });
}

// Draw an indoor plant with pot
function drawPlant(x, y, size) {
  // Pot
  ctx.fillStyle = '#8B6F47';
  ctx.beginPath();
  ctx.ellipse(sx(x), sy(y) + S(size * 0.8), S(size * 0.4), S(size * 0.3), 0, 0, Math.PI * 2);
  ctx.fill();

  // Pot detail
  ctx.strokeStyle = '#6A5A3A';
  ctx.lineWidth = S(1);
  ctx.stroke();

  // Soil
  ctx.fillStyle = '#654321';
  ctx.fillRect(sx(x - size * 0.35), sy(y + size * 0.5), S(size * 0.7), S(size * 0.3));

  // Leaves - green foliage
  ctx.fillStyle = '#2D7A2D';
  ctx.beginPath();
  ctx.arc(sx(x - size * 0.25), sy(y - size * 0.2), S(size * 0.35), 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3A9D3A';
  ctx.beginPath();
  ctx.arc(sx(x + size * 0.25), sy(y - size * 0.15), S(size * 0.3), 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#2D7A2D';
  ctx.beginPath();
  ctx.arc(sx(x), sy(y - size * 0.4), S(size * 0.25), 0, Math.PI * 2);
  ctx.fill();

// Draw bookshelf against wall
function drawBookshelf(x, y, w, h) {
  // Bookshelf background
  ctx.fillStyle = '#8B6F47';
  ctx.fillRect(sx(x), sy(y), S(w), S(h));

  // Bookshelf border
  ctx.strokeStyle = '#5A4A3A';
  ctx.lineWidth = S(1);
  ctx.strokeRect(sx(x), sy(y), S(w), S(h));

  // Shelves (3 shelves)
  for (let i = 0; i <= 3; i++) {
    const shelfY = y + (h / 3) * i;
    ctx.fillStyle = '#6A5A3A';
    ctx.fillRect(sx(x), sy(shelfY), S(w), S(2));
  }

  // Books - colorful rectangles on shelves
  const bookColors = ['#FF6B35', '#00BFFF', '#FFD700', '#9D4EDD', '#20B2AA', '#FF3355'];
  let colorIdx = 0;

  for (let shelf = 0; shelf < 3; shelf++) {
    const shelfY = y + (h / 3) * shelf + 4;
    const shelfSpacing = w / 5;

    for (let i = 0; i < 4; i++) {
      const bookX = x + 2 + i * shelfSpacing;
      const bookW = shelfSpacing - 2;
      const bookH = (h / 3) - 6;

      ctx.fillStyle = bookColors[colorIdx % bookColors.length];
      ctx.fillRect(sx(bookX), sy(shelfY), S(bookW), S(bookH));

      ctx.strokeStyle = '#0F0F14';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(sx(bookX), sy(shelfY), S(bookW), S(bookH));

      colorIdx++;
    }
  }
}

// ── FACEID SYSTEM - REAL CAMERA DETECTION ───────────────────────
let faceIdPending = false;
let faceIdApproved = false;
let faceVideoStream = null;
let faceDetected = false;
let cameraPermission = 'pending'; // 'pending' | 'granted' | 'denied'
let modelLoading = false;
let faceDetectStartTime = null;  // Track when face first detected for 5-second scanning

async function openFaceIdModal() {
  faceIdApproved = false;
  faceIdPending = true;
  faceDetected = false;
  cameraPermission = 'pending';

  const modal = document.getElementById('faceIdModal');
  modal.classList.add('active');

  const camera = document.getElementById('faceIdCamera');
  camera.classList.add('scanning');

  const video = document.getElementById('faceVideo');
  const canvas = document.getElementById('faceDetectionCanvas');
  const loadingStatus = document.getElementById('faceLoadingStatus');

  try {
    // Step 1: Request camera permission
    loadingStatus.textContent = '📷 REQUESTING CAMERA...';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera not supported');
    }

    faceVideoStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
      audio: false
    });

    cameraPermission = 'granted';
    video.srcObject = faceVideoStream;

    // Step 2: Load face-api models
    loadingStatus.textContent = '🧠 LOADING AI MODELS...';

    if (!modelLoading) {
      modelLoading = true;
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.load(MODEL_URL),
          faceapi.nets.faceLandmark68Net.load(MODEL_URL),
          faceapi.nets.faceExpressionNet.load(MODEL_URL),
        ]);
      } catch (e) {
        console.warn('Some models failed to load, trying minimal detection', e);
      }
    }

    // Wait for video to load
    await new Promise(resolve => {
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        resolve();
      };
    });

    loadingStatus.style.display = 'none';
    showFaceScanResult('🔍 SCANNING FACE...', 'normal');

    // Step 3: Detection loop - 5 SECOND SCANNING BEFORE AUTO-APPROVE
    const detectFace = async () => {
      if (!faceIdPending) return;

      try {
        const detections = await faceapi.detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions()
        ).withFaceLandmarks().withFaceExpressions();

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (detections.length >= 1) {
          // FACE DETECTED - START 5 SECOND SCAN
          const detection = detections[0];
          const box = detection.detection.box;

          // Initialize scan start time on first detection
          if (!faceDetectStartTime) {
            faceDetectStartTime = Date.now();
          }

          faceDetected = true;

          // Calculate scan duration and progress
          const scanDuration = Date.now() - faceDetectStartTime;
          const scanPercent = Math.min(100, Math.floor((scanDuration / 5000) * 100));

          // Draw bounding box (always GREEN)
          ctx.strokeStyle = '#00FF88';
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);

          // Draw landmarks
          ctx.fillStyle = '#00BFFF';
          const landmarks = detection.landmarks.positions;
          landmarks.forEach(point => {
            ctx.beginPath();
            ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
            ctx.fill();
          });

          // Show progress percentage
          ctx.fillStyle = '#00FF88';
          ctx.font = '16px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${scanPercent}%`, canvas.width / 2, 30);

          // Update status with progress
          showFaceScanResult(`SCANNING FACE... ${scanPercent}%`, 'normal');

          // AUTO-APPROVE AFTER 5 SECONDS
          if (scanDuration >= 5000) {
            showFaceScanResult('✓ FACE APPROVED', 'success');
            faceIdPending = false;
            faceDetectStartTime = null;

            setTimeout(() => {
              closeFaceIdModal();
              showToast('🔐 FACE ID APPROVED - Welcome!', 'green');

              // START DOOR OPENING ANIMATION
              doorAnimating = true;
              commanderEntering = false;  // Start entering sequence after door opens

              // After door animation completes (~1 second), CommandOS enters
              setTimeout(() => {
                commanderEntering = true;
                commanderShouldEnter = true;
                const commander = AGENTS.find(a => a.id === 'commander');
                if (commander) {
                  // Make CommandOS visible by changing from 'hidden' to 'walk'
                  commander.state = 'walk';
                  showToast('🚪 DOOR OPENED - CommandOS entering...', 'green');

                  // CEO walks the red path visiting desks: Door → RIGHT → DOWN → Main desk
                  // Waypoints based on the exact red path you drew
                  const waypoints = [
                    { x: 50, y: 150 },    // Start at door
                    { x: 120, y: 220 },   // STOP at Alexa desk (left)
                    { x: 380, y: 280 },   // STOP at Scout desk area (going right)
                    { x: 650, y: 280 },   // Going further right across top
                    { x: 650, y: 500 },   // STOP at Cal desk area (right side)
                    { x: 520, y: 650 },   // Down to main desk (final destination)
                  ];

                  // Small delay at each desk so CEO greets them
                  const STOP_DURATION = 1500;  // 1.5 seconds at each desk

                  // Use pathfinding to follow waypoints with stops at each desk
                  let pathIndex = 0;

                  function followNextWaypoint() {
                    if (pathIndex >= waypoints.length) {
                      // Reached final destination - sit at desk
                      commander.state = 'sit_work';
                      showToast('✅ CEO at his desk', 'green');
                      return;
                    }

                    const target = waypoints[pathIndex];
                    const isLastWaypoint = (pathIndex === waypoints.length - 1);
                    pathIndex++;

                    // Walk to waypoint
                    walkTo('commander', target.x, target.y, () => {
                      // Arrived at waypoint - stop and greet for a moment (except at final desk)
                      if (!isLastWaypoint) {
                        commander.state = 'idle';  // Stop and greet
                        showToast(`🤝 CEO visiting team...`, 'blue');

                        // After stopping, continue to next waypoint
                        setTimeout(() => {
                          commander.state = 'walk';
                          followNextWaypoint();
                        }, STOP_DURATION);
                      } else {
                        // At main desk - sit down
                        commander.state = 'sit_work';
                        showToast('✅ CEO at his desk', 'green');
                      }
                    });
                  }

                  // Start following the path
                  followNextWaypoint();
                }
              }, 1000);  // Wait for door to fully open
            }, 300);
            return;
          }
        } else {
          // NO FACE DETECTED - RESET TIMER
          faceDetected = false;
          faceDetectStartTime = null;
          ctx.fillStyle = '#FF6B35';
          ctx.font = '14px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('NO FACE DETECTED', canvas.width / 2, 30);
          showFaceScanResult('❌ NO FACE DETECTED', 'error');
        }
      } catch (err) {
        console.error('Detection error:', err);
      }

      if (faceIdPending) {
        requestAnimationFrame(detectFace);
      }
    };

    detectFace();

  } catch (err) {
    console.error('Face ID Error:', err);
    cameraPermission = 'denied';

    // BLOCK ACCESS - show error
    loadingStatus.textContent = '❌ CAMERA REQUIRED';
    loadingStatus.style.color = '#FF6B35';
    showFaceScanResult('🔐 Camera required for Face ID', 'error');
    showToast('❌ Camera access denied or not available', 'warn');
  }
}

function showFaceScanResult(text, status) {
  const resultDiv = document.getElementById('faceScanResult');
  resultDiv.textContent = text;
  resultDiv.className = status;
}

function closeFaceIdModal() {
  faceIdPending = false;
  faceIdApproved = false;

  // Stop video stream
  if (faceVideoStream) {
    faceVideoStream.getTracks().forEach(track => track.stop());
    faceVideoStream = null;
  }

  // Clear canvas
  const canvas = document.getElementById('faceDetectionCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Reset states
  faceDetected = false;

  // Hide modal
  document.getElementById('faceIdModal').classList.remove('active');

  // Show loading status again
  const loadingStatus = document.getElementById('faceLoadingStatus');
  if (loadingStatus) {
    loadingStatus.style.display = 'block';
    loadingStatus.textContent = '⏳ LOADING CAMERA...';
  }
}

// ── ENTRANCE DOOR & CONTROL - Top Left Corner ──────────────────
let doorIsOpen = false;  // Door state: true = open, false = closed
let doorOpenProgress = 0;  // Animation progress: 0 (closed) to 1 (open)
let doorAnimating = false;  // Is door currently animating?
let doorAnimationSpeed = 0.05;  // How fast door opens (0-1 per frame, ~0.05 = smooth)
let commanderShouldEnter = false;
let commanderEntering = false;  // Is CommandOS currently entering?

function drawEntranceDoor() {
  // Door positions in TOP LEFT CORNER (above top wall)
  const doorWidth = 80;   // LARGER DOOR
  const doorHeight = 100;  // LARGER DOOR
  const doorX = 30;  // Left side, near edge
  const doorY = 80;  // Top area

  // DOOR FRAME (always visible)
  ctx.fillStyle = '#5A4A3A';  // Dark wood frame
  ctx.fillRect(doorX - 5, doorY - 5, doorWidth + 10, doorHeight + 10);  // Frame border

  // DOOR BODY (slides based on animation progress)
  ctx.fillStyle = '#6B5345';  // Door color

  // Calculate door position based on animation progress
  // doorOpenProgress: 0 = closed, 1 = fully open
  const slideDistance = doorWidth * doorOpenProgress;
  const doorBodyX = doorX - slideDistance;  // Slides left as it opens

  ctx.fillRect(doorBodyX, doorY, doorWidth, doorHeight);

  // Door frame decoration (window/glass)
  ctx.strokeStyle = '#D4A574';
  ctx.lineWidth = 2;

  ctx.strokeRect(doorBodyX + 2, doorY + 2, doorWidth - 4, doorHeight - 4);

  // Glass reflection gets brighter as door opens
  ctx.fillStyle = '#FFD700';
  ctx.globalAlpha = 0.05 + (doorOpenProgress * 0.15);  // Brightens as door opens
  ctx.fillRect(doorBodyX + 2, doorY + 2, doorWidth - 4, doorHeight - 4);
  ctx.globalAlpha = 1;

  // Door handle (brass) - moves with door
  ctx.fillStyle = '#D4A574';
  ctx.fillRect(doorBodyX + doorWidth - 8, doorY + doorHeight/2 - 3, 5, 6);

  // Light from outside when door is opening
  if (doorOpenProgress > 0) {
    ctx.fillStyle = '#FFD700';
    ctx.globalAlpha = doorOpenProgress * 0.15;  // Light intensity matches door progress
    ctx.fillRect(0, doorY - 30, 150 * doorOpenProgress, 30);
    ctx.globalAlpha = 1;
  }
}

  ctx.strokeStyle = doorIsOpen ? '#00FF88' : '#00BFFF';  // Green=OPEN, Blue=LOCKED

  } else {
    ctx.shadowColor = '#00FF88';
    ctx.shadowBlur = 15;

  ctx.shadowBlur = 0;

  ctx.font = `${S(24)}px serif`;

  ctx.textBaseline = 'middle';
  ctx.fillText('🔐', buttonX + buttonWidth/2, buttonY + buttonHeight/2 - 2);

  ctx.font = `${S(5)}px "Press Start 2P", monospace`;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const statusText = doorIsOpen ? 'OPEN' : 'SCAN';
  ctx.fillText(statusText, buttonX + buttonWidth/2, buttonY + buttonHeight + 8);

  if (!doorIsOpen && (Math.sin(tick * 0.08) > 0)) {

    ctx.strokeStyle = '#00BFFF';
    ctx.lineWidth = 1;
    ctx.strokeRect(buttonX - 3, buttonY - 3, buttonWidth + 6, buttonHeight + 6);
    ctx.globalAlpha = 1;

  window.doorButtonRect = { x: buttonX, y: buttonY, w: buttonWidth, h: buttonHeight };
}

// ── RESPONSIVE ROOM WALLS - Ultra-Thin Professional Style ──────────────────
function drawRoomWalls() {
  const WALL_COLOR = '#8B7355';   // Coffee-brown wood color
  const WALL_DARK = '#6B5345';    // Darker shade for depth

  // ULTRA-THIN wall dimensions - maximum office space
  const topWallHeight = 180;      // Top wall: 180px (compact for windows)
  const sideWallWidth = 30;       // Side walls: 30px each (ULTRA-THIN)
  const bottomWallHeight = 70;    // Bottom wall: 70px (ULTRA-THIN)

  // ═══════════════════════════════════════════════════════════════
  // TOP WALL - Full width at the top
  // ═══════════════════════════════════════════════════════════════
  ctx.fillStyle = WALL_COLOR;
  ctx.fillRect(0, 0, CANVAS_WIDTH, topWallHeight);

  // Top wall shadow
  ctx.fillStyle = WALL_DARK;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(0, topWallHeight - 5, CANVAS_WIDTH, 5);
  ctx.globalAlpha = 1;

  // ═══════════════════════════════════════════════════════════════
  // LEFT WALL - REMOVED (open entrance)
  // ═══════════════════════════════════════════════════════════════
  // Left wall removed to allow open entrance from outside

  // ═══════════════════════════════════════════════════════════════
  // RIGHT WALL - Full height
  // ═══════════════════════════════════════════════════════════════
  ctx.fillStyle = WALL_COLOR;
  ctx.fillRect(CANVAS_WIDTH - sideWallWidth, 0, sideWallWidth, CANVAS_HEIGHT);

  // Right wall shadow
  ctx.fillStyle = WALL_DARK;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(CANVAS_WIDTH - sideWallWidth, 0, 5, CANVAS_HEIGHT);
  ctx.globalAlpha = 1;

  // ═══════════════════════════════════════════════════════════════
  // BOTTOM WALL - Full width at the bottom
  // ═══════════════════════════════════════════════════════════════
  ctx.fillStyle = WALL_COLOR;
  ctx.fillRect(0, CANVAS_HEIGHT - bottomWallHeight, CANVAS_WIDTH, bottomWallHeight);

  // Bottom wall shadow
  ctx.fillStyle = WALL_DARK;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(0, CANVAS_HEIGHT - bottomWallHeight, CANVAS_WIDTH, 5);
  ctx.globalAlpha = 1;

  // ═══════════════════════════════════════════════════════════════
  // WINDOWS - Only on TOP WALL, scale with canvas
  // ═══════════════════════════════════════════════════════════════
  const windowY = topWallHeight * 0.2;
  const windowH = topWallHeight * 0.65;
  const windowCount = 5;
  const windowW = (CANVAS_WIDTH - sideWallWidth * 2) / (windowCount + 1);

  for (let i = 0; i < windowCount; i++) {
    const wx = sideWallWidth + (i + 1) * windowW + (windowW * 0.05);

    // Window frame - black border
    ctx.fillStyle = '#0F0F14';
    ctx.fillRect(wx, windowY, windowW * 0.8, windowH);

    // Window glass - blue tint
    ctx.fillStyle = '#2D4A6A';
    ctx.fillRect(wx + 3, windowY + 3, windowW * 0.8 - 6, windowH - 6);

    // Window gradient (sunset effect)
    const gradient = ctx.createLinearGradient(wx, windowY, wx, windowY + windowH);
    gradient.addColorStop(0, '#6B2C7A');      // Purple top
    gradient.addColorStop(0.4, '#D4A574');    // Orange middle
    gradient.addColorStop(1, '#FF6B35');      // Red bottom
    ctx.fillStyle = gradient;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(wx + 3, windowY + 3, windowW * 0.8 - 6, windowH - 6);
    ctx.globalAlpha = 1;

    // Window panes - grid dividers
    ctx.strokeStyle = '#0F0F14';
    ctx.lineWidth = Math.max(1, canvas.width / 1200);

    // Vertical center divider
    ctx.beginPath();
    ctx.moveTo(wx + (windowW * 0.4), windowY + 3);
    ctx.lineTo(wx + (windowW * 0.4), windowY + windowH - 3);
    ctx.stroke();

    // Horizontal dividers
    ctx.beginPath();
    ctx.moveTo(wx + 3, windowY + windowH / 3);
    ctx.lineTo(wx + windowW * 0.8 - 3, windowY + windowH / 3);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(wx + 3, windowY + 2 * windowH / 3);
    ctx.lineTo(wx + windowW * 0.8 - 3, windowY + 2 * windowH / 3);
    ctx.stroke();
  }
}

    for (let x = floorX; x < floorX + floorWidth; x += plankWidth) {
      // Alternate plank colors (subtle variation)
      const seed = Math.floor((x / plankWidth) + (y / plankHeight)) % 3;
      let plankColor;

      if (seed === 0) {
        plankColor = '#B8A895';  // Slightly darker
      } else if (seed === 1) {
        plankColor = '#C4B5A0';  // Base color
      } else {
        plankColor = '#D0BFB0';  // Lighter variant
      }

      ctx.fillStyle = plankColor;
      ctx.fillRect(sx(x), sy(y), S(plankWidth), S(plankHeight));

      // Wood grain lines within each plank
      ctx.strokeStyle = '#A59885';
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 0.3;

      for (let i = 0; i < plankHeight; i += 4) {
        const waveOffset = Math.sin((x + i) * 0.02) * 3;
        ctx.beginPath();
        ctx.moveTo(sx(x), sy(y + i + waveOffset));
        ctx.lineTo(sx(x + plankWidth), sy(y + i + waveOffset));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Plank border highlight
      ctx.strokeStyle = '#DDD8CE';
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 0.5;
      ctx.strokeRect(sx(x), sy(y), S(plankWidth), S(plankHeight));
      ctx.globalAlpha = 1;
    }
  }

  // Glossy finish effect (subtle highlights)
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 15; i++) {
    const rx = floorX + Math.random() * floorWidth;
    const ry = floorY + Math.random() * floorHeight;
    const size = 30 + Math.random() * 50;
    ctx.beginPath();
    ctx.ellipse(sx(rx), sy(ry), S(size), S(size / 3), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Shadow line near walls for depth
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(sx(floorX), sy(floorY), S(3), S(floorHeight));  // Left shadow
  ctx.fillRect(sx(floorX + floorWidth - 3), sy(floorY), S(3), S(floorHeight));  // Right shadow
}

// ── Floor Texture Variation ──────────────────────────────────────────
function addFloorVariation() {
  // Add subtle color variation to existing floor for depth
  // Use darker spots in a pseudo-random pattern for worn look

  ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';

  // Create variation pattern across floor
  for (let y = 240; y < 918; y += 40) {
    for (let x = 80; x < 1120; x += 50) {
      // Pseudo-random darkening
      const seed = (Math.sin(x * 0.01) + Math.sin(y * 0.01)) * 100;
      if (Math.floor(seed) % 3 === 0) {
        ctx.fillRect(sx(x), sy(y), S(30), S(40));
      }
    }
  }
}

// ── Top Wall Windows (improved pixel-art) ────────────────────────
function enhanceWindowFrames() {
  const windowPositions = [150, 450, 750];
  const windowY = sy(70);

  windowPositions.forEach(wx => {

}

function drawCharts() {
  const cw = chartCanvas.width, ch = chartCanvas.height;
  cctx.clearRect(0, 0, cw, ch);
  cctx.fillStyle = '#080D16';
  cctx.fillRect(0, 0, cw, ch);

  // Skip Commander (last agent) in chart
  const agentsToShow = AGENTS.filter(a => a.id !== 'commander');
  const bw2 = Math.floor(cw / agentsToShow.length);

  agentsToShow.forEach((a, i) => {
    const bx = i * bw2 + 4;
    const maxH = ch - 30;
    const hpH = Math.floor(maxH * (a.hp / a.maxHp));
    const tasksH = Math.min(maxH, Math.floor(a.tasks * 8));

    // Task count bar (darker)
    cctx.fillStyle = a.color + '44';
    cctx.fillRect(bx, ch - 20 - tasksH, bw2 - 8, tasksH);

    // HP bar
    const hpColor = a.hp > 60 ? C.green : a.hp > 30 ? C.gold : C.red;
    cctx.fillStyle = hpColor;
    cctx.globalAlpha = a.state === 'dead' ? 0.25 : 0.85;
    cctx.fillRect(bx, ch - 20 - hpH, bw2 - 8, hpH);
    cctx.globalAlpha = 1;

    // Border
    cctx.strokeStyle = a.color + '55';
    cctx.lineWidth = 1;
    cctx.strokeRect(bx, ch - 20 - maxH, bw2 - 8, maxH);

    // Name
    cctx.font = `11px "Share Tech Mono", monospace`;
    cctx.fillStyle = a.state === 'dead' ? C.red : a.color;
    cctx.textAlign = 'center';
    cctx.textBaseline = 'middle';
    cctx.fillText(a.state === 'dead' ? '💀' : a.name.slice(0,5), bx + (bw2-8)/2, ch - 10);

    // HP value
    cctx.font = `13px "Share Tech Mono", monospace`;
    cctx.fillStyle = hpColor;
    cctx.fillText(a.state === 'dead' ? '0' : Math.ceil(a.hp), bx + (bw2-8)/2, ch - 20 - hpH - 8);
  });

  // Legend
  cctx.font = `12px "Share Tech Mono", monospace`;
  cctx.fillStyle = '#556';
  cctx.textAlign = 'left';
  cctx.fillText('█ HP', 4, 14);
  cctx.fillStyle = '#334';
  cctx.fillText('▒ tasks', 60, 14);
}

  if (doorAnimating) {
    doorOpenProgress += doorAnimationSpeed;
    if (doorOpenProgress >= 1.0) {
      doorOpenProgress = 1.0;
      doorAnimating = false;
      doorIsOpen = true;
    }
  }

  // Handle system states
  if (systemState === 'paused') {
    pauseTimer--;
    if (pauseTimer <= 0) {
      systemState = 'running';
      showToast('▶ Pause finished - resuming', 'green');
    }
    return;  // Don't advance scene when paused
  }

  if (systemState === 'stopped') {
    return;  // Don't advance when stopped
  }

  if (systemState === 'lunch') {
    lunchTimer--;

      systemState = 'running';

      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.value = 800;
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);

  // Walk home occasionally
  AGENTS.forEach(a => {
    if (a.state === 'walk' && !agentWalk[a.id]) {
      a.state = 'sit_work';
    }
  });

  // Update walking
  Object.entries(agentWalk).forEach(([id, w]) => {
    const a = AGENTS.find(x => x.id === id);
    if (!a || a.state === 'dead') { delete agentWalk[id]; return; }
    const dx = w.tx - a.x, dy = w.ty - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 3) {
      a.x = w.tx; a.y = w.ty;
      delete agentWalk[id];
      if (w.onArrive) w.onArrive();
    } else {
      const speed = 2;
      let newX = a.x + dx/dist * speed;
      let newY = a.y + dy/dist * speed;

      // Commander can move freely everywhere EXCEPT on ANY desk
      if (a.id === 'commander') {
        // Desk collision zones to AVOID (UPDATED for new positions)
        // Agent desks: Alexa (90-290, 190-260), Scout (500-700, 190-260), Memo (910-1110, 190-260)
        //              Doc (250-450, 430-500), Cal (750-950, 430-500)
        // Commander desk: (300-700, 630-750)
        const onAlexaDesk = newX >= 70 && newX <= 310 && newY >= 170 && newY <= 290;
        const onScoutDesk = newX >= 480 && newX <= 720 && newY >= 170 && newY <= 290;
        const onMemoDesk = newX >= 890 && newX <= 1130 && newY >= 170 && newY <= 290;
        const onDocDesk = newX >= 230 && newX <= 470 && newY >= 410 && newY <= 530;
        const onCalDesk = newX >= 730 && newX <= 970 && newY >= 410 && newY <= 530;
        const onCommanderDesk = newX >= 280 && newX <= 720 && newY >= 610 && newY <= 770;

        // If NOT on any desk and within bounds, allow movement
        if (!onAlexaDesk && !onScoutDesk && !onMemoDesk && !onDocDesk && !onCalDesk && !onCommanderDesk &&
            newX >= 0 && newX <= CANVAS_WIDTH && newY >= 0 && newY <= CANVAS_HEIGHT) {
          a.x = newX;
          a.y = newY;
        }
      } else {
        a.x = newX;
        a.y = newY;
      }
    }
  });

  // Decay bubbles
  bubbles.forEach(b => b.timer--);
  bubbles = bubbles.filter(b => b.timer > 0);

  // Decay status
  Object.keys(statusAbove).forEach(id => {
    statusAbove[id].timer--;
    if (statusAbove[id].timer <= 0) delete statusAbove[id];
  });

  // Decay wave
  Object.keys(waveAnim).forEach(id => {
    waveAnim[id]--;
    if (waveAnim[id] <= 0) delete waveAnim[id];
  });

  // Decay dead timer
  AGENTS.forEach(a => {
    if (a.state === 'dead' && a.deadTimer > 0) a.deadTimer--;
  });

  // Waves between agents
  if (sceneTimer % 180 === 0) {
    const alive = AGENTS.filter(a=>a.state!=='dead');
    if (alive.length >= 2) {
      waveAnim[alive[0].id] = 50;
      waveAnim[alive[1].id] = 50;
    }
  }

  // Loop
  if (sceneTimer > 750) sceneTimer = 0;
}

  // Apply transformations for game rendering
  ctx.translate(offsetX, offsetY);
  ctx.scale(zoomLevel, zoomLevel);

  // DRAW OFFICE ENVIRONMENT

  drawModernFloor();

  drawDoorButton();

  drawHUD();

  drawLargeCornerPlant(40, 120);      // Top-left corner
  drawLargeCornerPlant(1160, 120);    // Top-right corner
  drawLargeCornerPlant(40, 850);      // Bottom-left corner
  drawLargeCornerPlant(1160, 850);    // Bottom-right corner

  AGENTS.forEach((a, i) => {

    drawProfessionalDesk(g.x, g.y + 54, a, isCommander);
    // Draw desk items (monitors, phones, keyboards)
    drawDeskItems(g.x, g.y + 54, a, isCommander);
    // Draw agent on top of desk
    drawAgent(a);
  });

  ctx.restore();

  drawCharts();
  runAutoScene();
  tick++;
  requestAnimationFrame(render);
}

// ── Canvas Click Handler ────────────────────────────────────────────
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickXScreen = e.clientX - rect.left;
  const clickYScreen = e.clientY - rect.top;

  // Convert screen coordinates to game coordinates (1200x950), accounting for zoom and offset
  const clickX = (clickXScreen - offsetX) / zoomLevel;
  const clickY = (clickYScreen - offsetY) / zoomLevel;

  // Check door button click
  if (window.doorButtonRect) {
    const btn = window.doorButtonRect;
    if (clickX >= btn.x && clickX <= btn.x + btn.w &&
        clickY >= btn.y && clickY <= btn.y + btn.h) {
      handleDoorButtonClick();
      return;
    }
  }

  if (window.cmdButtons && window.cmdButtons.length > 0) {
    for (let btn of window.cmdButtons) {
      if (clickX >= btn.x && clickX <= btn.x + btn.w &&
          clickY >= btn.y && clickY <= btn.y + btn.h) {
        handleCommandButton(btn.action);
        return;
      }
    }
  }
});

function handleDoorButtonClick() {
  if (doorIsOpen) {
    // Close door
    doorIsOpen = false;
    faceIdApproved = false;
    showToast('🚪 DOOR CLOSED', 'orange');
  } else {
    // Open Face ID scanner
    if (!faceIdPending) {
      showToast('🔐 FACE ID SCANNING...', 'gold');
      openFaceIdModal();
    }
  }
}

function handleCommandButton(action) {
  console.log('Button pressed:', action);

  if (action === 'meeting') {
    if (!inMeeting) {
      inMeeting = true;
      showToast('🔔 MEETING - all gather at center! Press STOP to dismiss', 'gold');
      AGENTS.forEach(a => {
        if (a.id !== 'commander') {
          walkTo(a.id, 480, 400);  // Center of canvas
        }
      });
    }
  } else if (action === 'pause') {
    systemState = 'paused';
    pauseTimer = 300;  // 5 minutes (300 ticks)
    showToast('⏸ SYSTEM PAUSED - resuming in 5 minutes', 'gold');
  } else if (action === 'stop') {
    if (inMeeting) {
      // End the meeting
      inMeeting = false;
      showToast('✓ Meeting ended - returning to desks', 'green');
      AGENTS.forEach(a => {
        if (a.id !== 'commander') {
          const idx = AGENTS.indexOf(a);
          const g = GRID[idx];
          walkTo(a.id, g.x + 80, g.y + 110);
        }
      });
    } else {
      // Toggle work state
      systemState = systemState === 'stopped' ? 'running' : 'stopped';
      if (systemState === 'stopped') {
        showToast('⏹ ALL SYSTEMS STOPPED', 'orange');
      } else {
        showToast('▶ SYSTEMS RUNNING', 'green');
      }
    }
  } else if (action === 'lunch') {
    const mins = prompt('🍽 Lunch break duration (minutes):', '30');
    if (mins && !isNaN(mins) && parseInt(mins) > 0) {
      const duration = parseInt(mins);
      systemState = 'lunch';
      lunchDuration = duration * 60;
      lunchTimer = lunchDuration;
      showToast(`🍽 LUNCH TIME - ${duration} minutes!`, 'gold');
      AGENTS.forEach(a => {
        if (a.id !== 'commander') a.state = 'hidden';
      });
    }
  }
}

// ── Init ─────────────────────────────────────────────────────────────
buildAgentButtons();
setLang('ro');

// Place agents at their desk positions
AGENTS.forEach((a, i) => {
  if (a.id === 'commander') {
    // CommandOS starts OUTSIDE at top-left door, waits for user to open door
    a.x = 20;   // LEFT side (outside)
    a.y = 100;  // TOP area (near door)
    a.state = 'idle';  // Wait for user to open door
    // No automatic entry - user must click button!
  } else {
    a.x = GRID[i].x + 80;
    a.y = GRID[i].y + 90;
    a.state = 'sit_work';
  }
  a.homeX = a.x;
  a.homeY = a.y;
});

// AUTO-START FACE ID SCANNING ON PAGE LOAD
// User doesn't need to click the button - Face ID starts automatically
setTimeout(() => {
  showToast('🔐 FACE ID SCANNING... (Wave at camera)', 'gold');
  openFaceIdModal();
}, 500);  // Small delay to let UI render first

render();
</script>
